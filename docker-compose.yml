services:
  amplifica-crm:
    build: .
    container_name: amplifica-crm
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./whatsapp_auth_sessions:/app/whatsapp_auth_sessions
      - ./whatsapp_polls.json:/app/whatsapp_polls.json
      - ./whatsapp_interaction_logs.txt:/app/whatsapp_interaction_logs.txt
      - ./n8n_interaction_logs.txt:/app/n8n_interaction_logs.txt
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
