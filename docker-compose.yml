# AgencyFlow CRM - Docker Compose for ZimaOS
services:
  app:
    build: .
    container_name: agencyflow-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=45.167.187.80
      - DB_PORT=5432
      - DB_USER=agency_admin
      - DB_PASSWORD=agency_secure_password
      - DB_NAME=agencyflow_db
      - DATABASE_URL=postgresql://agency_admin:agency_secure_password@45.167.187.80:5432/agencyflow_db
      - GEMINI_API_KEY=
      - VITE_COMPANY_NAME=AgencyFlow CRM
      - VITE_SERVER_INTERNAL_IP=192.168.3.6
      - VITE_SERVER_EXTERNAL_IP=45.167.187.80
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:15-alpine
    container_name: agencyflow-db
    environment:
      - POSTGRES_USER=agency_admin
      - POSTGRES_PASSWORD=agency_secure_password
      - POSTGRES_DB=agencyflow_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency_admin -d agencyflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: agencyflow-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@agency.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "8080:80"
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:
