services:
  amplifica-crm:
    # A recomendação é sempre usar uma tag específica de versão (ex: v1.0.0, v1.1.0)
    # em vez de 'latest'. Assim você terá controle sobre quando atualizar o CRM.
    # Usamos docker.io/ para evitar erros de mirror inválidos do ZimaOS (como 1panel.live)
    image: docker.io/werikoliveira/amplifica-crm:2.2 
    container_name: amplifica-crm
    restart: unless-stopped
    ports:
      - "3000:3000" # Porta padrão do CRM (inclui a Landing Page)
    environment:
      # --- CONFIGURAÇÕES DA LANDING PAGE & MARCA ---
      - VITE_COMPANY_NAME=Amplifica CRM # Nome que aparece na Landing Page e no Header
      - VITE_PRIMARY_COLOR=#4f46e5    # Cor base da sua marca (Hex)
      
      # --- CONFIGURAÇÕES DO SERVIDOR ---
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=https://seu-dominio.com # Substitua pelo seu domínio HTTPS final

      # --- CONEXÃO SUPABASE (Obrigatório) ---
      # No ZimaOS, você cola estas chaves diretamente na interface de Variáveis de Ambiente
      - SUPABASE_URL=https://wfdvszqfsvnrtdouuygy.supabase.co
      - SUPABASE_ANON_KEY=sb_publishable_rjAkTZq7AlDqZ-ibucO0SA_k6UJy8l6
      - SUPABASE_SERVICE_ROLE_KEY=SUA_SERVICE_ROLE_KEY_AQUI

      # --- INTELIGÊNCIA ARTIFICIAL ---
      - GEMINI_API_KEY=SUA_GEMINI_KEY_AQUI

      # --- INTEGRAÇÃO GOOGLE ---
      - GOOGLE_CLIENT_ID=SEU_GOOGLE_CLIENT_ID_AQUI
      - GOOGLE_CLIENT_SECRET=SEU_GOOGLE_CLIENT_SECRET_AQUI
      - GOOGLE_REDIRECT_URI=https://seu-dominio.com/api/google/callback

      # --- INTEGRAÇÃO FACEBOOK/INSTAGRAM ---
      - FACEBOOK_APP_ID=SEU_FACEBOOK_APP_ID_AQUI
      - FACEBOOK_APP_SECRET=SEU_FACEBOOK_APP_SECRET_AQUI
      - FACEBOOK_REDIRECT_URI=https://seu-dominio.com/api/facebook/callback
      
      # --- FRONTEND CONFIG (VITE) ---
      - VITE_SUPABASE_URL=https://wfdvszqfsvnrtdouuygy.supabase.co
      - VITE_SUPABASE_ANON_KEY=sb_publishable_rjAkTZq7AlDqZ-ibucO0SA_k6UJy8l6
      - VITE_COMPANY_NAME=Amplifica CRM
      - VITE_PRIMARY_COLOR=#4f46e5

    volumes:
      # Volumes persistentes para sessões do WhatsApp e logs
      - ./whatsapp_auth_sessions:/app/whatsapp_auth_sessions
      - ./whatsapp_polls.json:/app/whatsapp_polls.json
      - ./logs/whatsapp_interaction_logs.txt:/app/logs/whatsapp_interaction_logs.txt
      - ./logs/n8n_interaction_logs.txt:/app/logs/n8n_interaction_logs.txt
    
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
